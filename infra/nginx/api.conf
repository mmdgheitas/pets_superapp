# Nginx reverse proxy for the Pet Marketplace API (ArvanCloud VM).
# TLS is terminated here with Let's Encrypt (certbot — see infra/README.md).

upstream pets_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.petshop.ir;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.petshop.ir;

    ssl_certificate     /etc/letsencrypt/live/api.petshop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.petshop.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m; # image uploads (API also enforces 5MB per file)

    gzip on;
    gzip_types application/json text/plain;

    location / {
        proxy_pass http://pets_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
