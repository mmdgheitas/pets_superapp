# Pet Marketplace — Docker Compose (Phase 1-2 per spec; Kubernetes comes in Phase 3+)
#
# Dev usage (deps only):  docker compose up -d mysql redis
# Full stack with API:    docker compose --profile app up --build
name: pets-superapp

services:
  mysql:
    image: mysql:8.4
    container_name: pets-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pets_superapp}
      MYSQL_USER: ${MYSQL_USER:-pets}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pets_dev_password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pets-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pets-api
    restart: unless-stopped
    env_file:
      - ./backend/.env.development
    environment:
      DATABASE_URL: mysql://pets:pets_dev_password@mysql:3306/pets_superapp
      REDIS_HOST: redis
      API_PUBLIC_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
