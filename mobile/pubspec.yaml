name: pets_app
description: "Pet Marketplace super-app (پت‌شاپ) — Flutter client"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state + navigation (per spec)
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # networking
  dio: ^5.7.0

  # local storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2

  # push notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # i18n / fa formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
